<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c0b09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />

    <title>Hilbras — Build. Connect. Create.</title>
    <meta
      name="description"
      content="Hilbras is an independent technology company building software infrastructure, developer tools, AI systems, digital platforms, computing environments, and security tooling."
    />
    <link rel="canonical" href="https://hilbras.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hilbras" />
    <meta property="og:url" content="https://hilbras.vercel.app/" />
    <meta property="og:title" content="Hilbras — Build. Connect. Create." />
    <meta
      property="og:description"
      content="A technology company building AI infrastructure, developer tools, application platforms, computing environments, and security tooling."
    />
    <meta property="og:image" content="https://hilbras.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hilbras — a technology ecosystem of independent products." />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hilbras — Build. Connect. Create." />
    <meta
      name="twitter:description"
      content="A technology company building AI infrastructure, developer tools, application platforms, computing environments, and security tooling."
    />
    <meta name="twitter:image" content="https://hilbras.vercel.app/og.png" />
    <meta name="twitter:image:alt" content="Hilbras — a technology ecosystem of independent products." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts are self-hosted (see src/index.css). The two latin subsets that
         paint the hero are preloaded; the rest arrive with the stylesheet. -->
    <link
      rel="preload"
      href="/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />


    <script>
      (function () {
        // The scroll-reveal hidden state is gated on this class. Setting it here,
        // before first paint, means nothing flashes in at full opacity first —
        // and a visitor without JavaScript simply never gets the hidden state.
        document.documentElement.classList.add('has-js');
        try {
          var stored = localStorage.getItem('hilbras-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; font-family: system-ui, sans-serif">
        <h1>Hilbras — Build. Connect. Create.</h1>
        <p>
          Hilbras is an independent technology company building software infrastructure, developer tools, AI
          systems, digital platforms, computing environments, and security tooling. The Hilbras ecosystem covers
          AI infrastructure, developer infrastructure, platforms, social technology, computing, and security.
        </p>
        <p>
          This homepage needs JavaScript. The projects themselves are listed on
          <a href="https://github.com/Hilbras">github.com/Hilbras</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
